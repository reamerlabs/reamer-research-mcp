[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "reamer-research-mcp"
version = "0.2.0"
description = "MCP server for Reamer Research: run backtests, Monte Carlo and visual trade diagnostics from Claude, Cursor and other MCP clients."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Reamer Labs", email = "support@reamerlabs.com" }]
keywords = ["mcp", "backtesting", "algorithmic-trading", "trading", "quant", "monte-carlo", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=1.2",
  # the engine, from PyPI: wheels exist for Linux x86_64 and macOS on Apple Silicon
  "reamer-research>=4.11.5; (sys_platform == \"linux\" and platform_machine == \"x86_64\") or (sys_platform == \"darwin\" and platform_machine == \"arm64\")",
]

[project.urls]
Homepage = "https://reamerlabs.com/products/reamer-research"
Documentation = "https://reamerlabs.com/docs"
Source = "https://github.com/reamerlabs/reamer-research-mcp"
Engine = "https://pypi.org/project/reamer-research/"

[project.scripts]
reamer-research-mcp = "reamer_research_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reamer_research_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "server.json"]
